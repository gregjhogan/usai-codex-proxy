[project]
name = "usai-codex-proxy"
version = "0.1.0"
description = "Translates the OpenAI Responses API (Codex) to USAi chat/completions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
usai-codex-proxy = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "catalog.py", "usai_models.json"]
